name: ci

# Supply-chain hardening (review R9):
# - least-privilege token (read-only contents)
# - third-party and first-party Actions pinned to full commit SHAs
# - no persisted credentials in the workspace
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      qualification-scenario:
        description: "Browser qualification scenario (§82-§84)"
        type: choice
        default: existing-browser
        options:
          - existing-browser
          - cold-start
          - remote-debugging-disabled
      qualification-browser:
        description: "Target browser this run qualifies (identity-isolated)"
        type: choice
        default: chrome
        options:
          - chrome
          - chromium
          - edge
      run-smoke:
        description: "Also run the browser smoke suite (isolated step, after the scenario)"
        type: boolean
        default: false
      run-sentinel:
        description: "Also run the real sentinel-path suite (isolated step, needs an attachable target)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static-tests:
    name: static suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - name: Run static test suite (manifest schema, pins, security policy, budgets)
        env:
          BROWSER_USE_SKIP_RUNTIME: "1"
        run: node --test

  runtime-contract:
    name: live MCP contract (real uvx runtime, no Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Warm the pinned runtime (first resolution needs network)
        run: uvx --python 3.12 browser-use@0.13.10 --help
      - name: Contract gate vs. snapshot (§70)
        run: node scripts/verify-runtime-contract.mjs
      - name: MCP integration tests (initialize / tools/list / shutdown — §80)
        run: node --test tests/mcp/contract.test.mjs

  upstream-drift:
    name: upstream drift (review hint, non-blocking — §71)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node scripts/verify-upstream.mjs --json

  # Manual qualification. Runner requirements (review R9):
  #   dedicated, ephemeral, no production secrets, no personal files —
  #   the job executes real PyPI-resolved Python code and drives a real browser
  #   via browser_exec (treat the runner as an untrusted execution environment).
  # The runner label matches the target browser (chrome|chromium|edge) so a
  # dedicated Chromium runner is never handed a chrome run.
  # Steps are ISOLATED single files by design: the Node runner executes test
  # files concurrently by default, and anything else touching the browser
  # during the selected scenario would break the controlled prerequisite /
  # dedicated-target / no-competing-endpoint assumptions. The ordinary suite
  # stays in push CI; smoke and sentinel suites run only as explicitly
  # selected follow-up steps, serially.
  browser-qualification:
    name: browser qualification — ${{ inputs.qualification-browser || 'chrome' }} / ${{ inputs.qualification-scenario || 'existing-browser' }}
    runs-on: [self-hosted, ${{ inputs.qualification-browser || 'chrome' }}]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: npm ci
      - name: Selected qualification scenario (isolated)
        env:
          BROWSER_USE_QUALIFICATION: "1"
          BROWSER_USE_QUALIFICATION_SCENARIO: ${{ inputs.qualification-scenario || 'existing-browser' }}
          BROWSER_USE_QUALIFICATION_BROWSER: ${{ inputs.qualification-browser || 'chrome' }}
        run: node --test tests/browser/qualification.test.mjs
      - name: Browser smoke (isolated, serial follow-up)
        if: ${{ inputs.run-smoke == true }}
        env:
          BROWSER_USE_BROWSER_TESTS: "1"
          BROWSER_USE_QUALIFICATION_BROWSER: ${{ inputs.qualification-browser || 'chrome' }}
        run: node --test tests/browser/smoke.test.mjs
      - name: Real sentinel paths (isolated, serial follow-up)
        if: ${{ inputs.run-sentinel == true }}
        env:
          BROWSER_USE_BROWSER_TESTS: "1"
        run: node --test tests/security/reference-host.test.mjs
